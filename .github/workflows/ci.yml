name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  APP_URL: http://localhost:5173
  DATABASE_URL: postgresql://bizu_app:bizu_app@localhost:5432/bizu
  DIRECT_URL: postgresql://bizu_owner:bizu_owner@localhost:5432/bizu
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
  CREDENTIALS_ENCRYPTION_KEY: Y2ktb25seS1jcmVkZW50aWFscy1rZXktMzItYnl0ZXM=
  AUDIT_SALT: ci-only-audit-salt-not-for-production
  EMAIL_PROVIDER: memory

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Mesmo SQL do docker-compose: cria o banco `bizu` e os papéis bizu_owner/bizu_app.
      - name: Criar papéis do Postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - run: npm run db:migrate
      # Tabelas do pg-boss (schema pgboss) e filas, com bizu_owner.
      - run: npm run jobs:install
      - run: npm run test:db
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # Prova que Stripe, Sentry e S3 saem apagando a pasta: typecheck e testes sem ela.
  # Não precisa de banco (npm test roda sem Postgres).
  module-removal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [stripe, sentry, s3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:module-removal -- ${{ matrix.module }}
