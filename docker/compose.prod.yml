# Stack de produção do Bizu SaaS: app, worker (opcional), migrate, postgres, caddy e backup.
#
# Uso em VPS (Docker Compose v2.20+), na raiz do repositório:
#   cp docker/.env.prod.example docker/.env.prod      # preencha; o arquivo não é versionado
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml build
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml up -d postgres
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml --profile tools run --rm migrate
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml up -d app caddy
#
# Portainer: Stacks > Add stack > Repository, com este arquivo como "Compose path" e as
# variáveis de docker/.env.prod.example na seção "Environment variables". O build precisa do
# repositório, então o modo "Web editor" não serve. Perfis: COMPOSE_PROFILES=worker,backup.
#
# Passo a passo, backup e restauração: docs/context/tech/14-deploy.md e README.md.
#
# Todas as variáveis vêm de ${...}: obrigatórias com `:?` (a subida falha dizendo qual falta),
# opcionais com `:-` e valor vazio (src/lib/env.ts trata vazio como ausente).

# Nome próprio: não divide containers nem volumes com o docker-compose.yml de desenvolvimento.
name: bizu-saas-prod

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  APP_URL: ${APP_URL:?defina APP_URL com a URL pública, com https://}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  # src/lib/env.ts exige DIRECT_URL em todo processo, mas só o instalador da fila e as migrations
  # a usam. App e worker recebem a do bizu_app (sem BYPASSRLS): a senha do dono das tabelas fica
  # só no migrate, que a sobrescreve abaixo.
  DATABASE_URL: postgresql://bizu_app:${BIZU_APP_PASSWORD:?defina BIZU_APP_PASSWORD}@postgres:5432/bizu
  DIRECT_URL: postgresql://bizu_app:${BIZU_APP_PASSWORD}@postgres:5432/bizu
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?gere com openssl rand -base64 32}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?gere com openssl rand -base64 32}
  CREDENTIALS_ENCRYPTION_KEY_PREVIOUS: ${CREDENTIALS_ENCRYPTION_KEY_PREVIOUS:-}
  CREDENTIALS_KEY_VERSION: ${CREDENTIALS_KEY_VERSION:-1}
  AUDIT_SALT: ${AUDIT_SALT:?gere com openssl rand -hex 16}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:?defina EMAIL_FROM}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
  PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ASAAS_API_KEY: ${ASAAS_API_KEY:-}
  ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
  ASAAS_SANDBOX: ${ASAAS_SANDBOX:-true}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_LOCAL_DIR: /data/storage
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Postgres 16. O init só roda no primeiro start do volume: cria bizu_owner, bizu_app (e o
  # bizu_backup, se BIZU_BACKUP_PASSWORD existir) com as senhas do .env e o banco `bizu`.
  # Sem porta publicada: só a rede da stack enxerga o banco. Para um Postgres gerenciado,
  # apague este serviço, rode docker/postgres/init.sql com o psql e ajuste as URLs.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      BIZU_OWNER_PASSWORD: ${BIZU_OWNER_PASSWORD:?defina BIZU_OWNER_PASSWORD}
      BIZU_APP_PASSWORD: ${BIZU_APP_PASSWORD:?defina BIZU_APP_PASSWORD}
      BIZU_BACKUP_PASSWORD: ${BIZU_BACKUP_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/opt/bizu/init.sql:ro
      - ./postgres/init-prod.sh:/docker-entrypoint-initdb.d/10-init-prod.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Aplicação: assets, /api/* e SSR no mesmo processo. O healthcheck vem do Dockerfile.
  # APP_JOBS_MODE=inline (padrão) roda a fila aqui. Ao ligar o perfil `worker`, defina
  # APP_JOBS_MODE=off, senão app e worker consomem a mesma fila.
  # APP_IMAGE aponta para um registry quando você publica a imagem em vez de construir na VPS.
  app:
    image: ${APP_IMAGE:-bizu-saas:local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
      JOBS_MODE: ${APP_JOBS_MODE:-inline}
    volumes:
      - storage:/data/storage
    expose:
      - "3000"
    logging: *logging

  # Worker opcional (perfil `worker`): mesma imagem, só os jobs, sem HTTP. Com ele, defina
  # APP_JOBS_MODE=off no app. Várias réplicas de app + RATE_LIMIT_STORE=postgres escalam sem Redis.
  worker:
    image: ${APP_IMAGE:-bizu-saas:local}
    profiles: ["worker"]
    restart: unless-stopped
    command: ["node", "build/server/index.js", "--worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
      JOBS_MODE: worker
    volumes:
      - storage:/data/storage
    # O worker não escuta porta: o HEALTHCHECK da imagem (HTTP) o marcaria como unhealthy.
    healthcheck:
      disable: true
    logging: *logging

  # Migrations e instalação da fila (perfil `tools`). Usa o estágio `build` da imagem, que tem
  # drizzle-kit, tsx e drizzle/; o runtime não. Rode antes de subir uma versão nova:
  #   docker compose --env-file docker/.env.prod -f docker/compose.prod.yml --profile tools run --rm migrate
  # Aplica as migrations com DIRECT_URL (bizu_owner) e instala o schema pgboss. Idempotente.
  migrate:
    profiles: ["tools"]
    image: bizu-saas-migrate:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
      DIRECT_URL: postgresql://bizu_owner:${BIZU_OWNER_PASSWORD:?defina BIZU_OWNER_PASSWORD}@postgres:5432/bizu
      JOBS_MODE: "off"
    command: ["sh", "-c", "npm run db:migrate && npm run jobs:install"]

  # Reverse proxy com TLS automático. SITE_ADDRESS é o domínio (DNS apontando para a VPS e as
  # portas 80 e 443 livres). Teste local sem TLS: SITE_ADDRESS=http://localhost.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS com o domínio, ou http://localhost para testar}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # Backup cifrado com `age` (perfil `backup`): pg_dump diário e os arquivos de /data/storage.
  # Precisa de BACKUP_AGE_RECIPIENT (chave PÚBLICA) e de BIZU_BACKUP_PASSWORD, definida antes do
  # primeiro start do Postgres (o backup.sh recusa subir sem eles). Restauração e teste mensal:
  # docs/context/tech/14-deploy.md. O compose interpola perfis inativos, por isso aqui é `:-`.
  backup:
    profiles: ["backup"]
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: bizu_backup
      PGPASSWORD: ${BIZU_BACKUP_PASSWORD:-}
      PGDATABASE: bizu
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - storage:/storage:ro
    logging: *logging

volumes:
  postgres_data:
  storage:
  backups:
  caddy_data:
  caddy_config:
